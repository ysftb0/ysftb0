
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>14:00 Webkit By ysftb0</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 margin:0;
 background:#000;
 color:#d0d0d0;
 font-family:Menlo,Monaco,Consolas,monospace;
 font-size:20px;
 font-weight:800;
 text-transform:uppercase;
}

body{
 overflow:hidden;
}

#terminal{
 width:100%;
 height:100%;
 padding:25px 18px 35px;
 overflow-y:auto;
 overflow-x:hidden;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 text-align:left;
 scrollbar-width:none;
}

#terminal::-webkit-scrollbar{
 display:none;
}

.line{
 line-height:36px;
 min-height:36px;
 font-size:20px;
 font-weight:800;
 letter-spacing:.5px;
}

.header{
 display:block;
 width:100%;
 color:#fff;
 font-size:34px;
 font-weight:900;
 letter-spacing:1px;
 line-height:48px;
 text-align:left;
 margin:0 0 25px;
}

.info{color:#d0d0d0}
.ok{color:#8fe0a5}
.fail{color:#ff7777}
.warn{color:#e9c477}
.muted{color:#777}

.cursor{
 display:inline-block;
 width:11px;
 height:22px;
 background:#fff;
 animation:blink 1s steps(2) infinite;
 vertical-align:-4px;
}

@keyframes blink{
 50%{opacity:0}
}
</style>
</head>

<body>

<div id="terminal">
 <div class="line header">14:00 Webkit By ysftb0</div>
</div>

<script>
(async()=>{
"use strict";

const terminal=document.getElementById("terminal");

function log(tag,message="",type="info"){
 const line=document.createElement("div");
 line.className="line "+type;
 line.textContent=message
  ?tag+"  "+message
  :tag;

 terminal.appendChild(line);
 terminal.scrollTop=terminal.scrollHeight;
}

function delay(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

log("INITIALIZING","CACHE CHECK");
await delay(350);

if(!("serviceWorker" in navigator)){
 log("WARNING","SERVICE WORKER NOT SUPPORTED","warn");
}

if(!("caches" in window)){
 log("ERROR","CACHE API NOT AVAILABLE","fail");
 return;
}

let cacheReady=false;

try{
 const cacheNames=await caches.keys();

 if(cacheNames.length){
  log("CACHE","STORAGE DETECTED","ok");

  for(const name of cacheNames){
   const cache=await caches.open(name);
   const keys=await cache.keys();

   log("CACHE",name,"info");
   log("FILES",String(keys.length),"info");
  }
 }else{
  log("CACHE","NO CACHE FOUND","warn");
 }

 const response=await fetch("./jb.html",{
  method:"GET",
  cache:"no-cache"
 });

 if(!response.ok){
  throw new Error("HTTP "+response.status);
 }

 const html=await response.text();

 if(!html.trim()){
  throw new Error("EMPTY FILE");
 }

 cacheReady=true;
 log("JB.HTML","FILE AVAILABLE","ok");

}catch(error){
 log("CACHE ERROR",error.message,"fail");
}

if(cacheReady){
 log("STATUS","READY","ok");
 log("REDIRECT","OPENING JB.HTML","info");

 await delay(500);
 location.replace("./jb.html");
 return;
}

log("RETRY","ONE RETRY IN 2 SECONDS","warn");
await delay(2000);

try{
 const response=await fetch("./jb.html",{
  method:"GET",
  cache:"reload"
 });

 if(!response.ok){
  throw new Error("HTTP "+response.status);
 }

 const html=await response.text();

 if(!html.trim()){
  throw new Error("EMPTY FILE");
 }

 log("RETRY","SUCCESS","ok");
 await delay(500);
 location.replace("./jb.html");

}catch(error){
 log("FAILED",error.message,"fail");
 log("INFO","CHECK YOUR FILES AND CACHE","muted");
}

})();
</script>

</body>
</html>
