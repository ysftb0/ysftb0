
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>14:00 Webkit By ysftb0</title>

<style>

*{
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 margin:0;
 background:#000;
 color:#d0d0d0;
 font-family:Menlo,Monaco,Consolas,monospace;
 font-size:20px;
 font-weight:800;
 text-transform:uppercase;
}

body{
 overflow:hidden;
}

#terminal{
 width:100%;
 height:100%;
 padding:25px 18px 35px;
 overflow-y:auto;
 overflow-x:hidden;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 text-align:left;
 scrollbar-width:none;
}

#terminal::-webkit-scrollbar{
 display:none;
}

.line{
 line-height:36px;
 min-height:36px;
 font-size:20px;
 font-weight:800;
 letter-spacing:.5px;
 text-align:left;
}

.header{
 display:block;
 width:100%;
 color:#fff;
 font-size:34px;
 font-weight:900;
 letter-spacing:1px;
 line-height:48px;
 text-align:left;
 margin:0 0 25px;
}

.info{color:#d0d0d0}
.ok{color:#8fe0a5}
.fail{color:#ff7777}
.warn{color:#e9c477}
.muted{color:#777}

.cursor{
 display:inline-block;
 width:11px;
 height:22px;
 background:#fff;
 animation:blink 1s steps(2) infinite;
 vertical-align:-4px;
}

@keyframes blink{
 50%{opacity:0}
}

}
</style>
</head>

<body>

<div id="terminal">
 <div class="line header">14:00 Webkit By ysftb0</div>
</div>
<script type="module">
 import "./jb.js";
</script>
</body>
</html>
