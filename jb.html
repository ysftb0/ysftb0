
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>14:00 Webkit By ysftb0</title>

<style>


*{
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 margin:0;
 padding:0;
 background:#000;
 color:#d0d0d0;
 font-family:Menlo,Monaco,Consolas,monospace;
 font-size:25px;
 font-weight:900;
 text-transform:uppercase;
}

body{
 overflow:hidden;
}

#terminal{
 width:100%;
 height:100%;
 margin:0;
 padding:0 12px 10px;
 overflow-y:auto;
 overflow-x:hidden;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 text-align:left;
 scrollbar-width:none;
}

#terminal::-webkit-scrollbar{
 display:none;
}

.line{
 display:block;
 margin:0;
 padding:0;
 line-height:1.18;
 min-height:0;
 font-size:25px;
 font-weight:900;
 letter-spacing:0;
 text-align:left;
}

.header{
 display:block;
 width:100%;
 color:#fff;
 font-size:34px;
 font-weight:900;
 letter-spacing:.5px;
 line-height:1.18;
 text-align:left;
 margin:0;
 padding:0;
}

.info{color:#d0d0d0}
.ok{color:#8fe0a5}
.fail{color:#ff7777}
.warn{color:#e9c477}
.muted{color:#777}

.cursor{
 display:inline-block;
 width:12px;
 height:25px;
 background:#fff;
 animation:blink 1s steps(2) infinite;
 vertical-align:-3px;
}

@keyframes blink{
 50%{opacity:0}
}

</style>
</head>

<body>

<div id="terminal">
 <div class="line header">14:00 Webkit By ysftb0</div>
</div>
<script>
 (() => {
  const originalLog = console.log;
  const originalError = console.error;
  const originalWarn = console.warn;
  
  function showConsole(type, args) {
   const terminal = document.getElementById("terminal");
   if (!terminal) return;
   
   const line = document.createElement("div");
   line.className = "line " + (
    type === "ERROR" ? "fail" :
    type === "WARN" ? "warn" : "info"
   );
   
   line.textContent = `[${type}] ` +
    args.map(value =>
     typeof value === "object" ?
     JSON.stringify(value) :
     String(value)
    ).join(" ");
   
   terminal.appendChild(line);
   terminal.scrollTop = terminal.scrollHeight;
  }
  
  console.log = (...args) => {
   originalLog.apply(console, args);
   showConsole("LOG", args);
  };
  
  console.warn = (...args) => {
   originalWarn.apply(console, args);
   showConsole("WARN", args);
  };
  
  console.error = (...args) => {
   originalError.apply(console, args);
   showConsole("ERROR", args);
  };
 })();
</script>

<script type="module" src="./jb.js"></script>
<script type="module">
 import "./jb.js";
</script>
<script>
(()=>{
 "use strict";

 const terminal=document.getElementById("terminal");
 let cursor=null;

 const categories={
  "PROOF-OK":"ok",
  "PRIMITIVE-OK":"ok",
  "PRIMITIVE-ONLY":"ok",
  "PROOF-FAIL":"fail",
  "JB-THREW":"fail",
  "AG-FAIL":"fail",
  "FW-UNSUPPORTED":"fail",
  "RETRY":"warn",
  "WAIT":"warn",
  "INFO":"info",
  "FW":"info",
  "BASES":"info",
  "STUBS":"info",
  "PAIR-STATUS":"info",
  "JB-END":"muted",
  "OK":"ok",
  "FAIL":"fail"
 };

 function add(tag,detail=""){
  const line=document.createElement("div");
  line.className="line "+(categories[tag]||"info");

  line.textContent=
   String(tag)+(detail?"  "+String(detail):"");

  if(cursor){
   terminal.insertBefore(line,cursor);
  }else{
   terminal.appendChild(line);
  }

  terminal.scrollTop=terminal.scrollHeight;
 }

 window.ysftb0Log=function(tag,detail){
  add(String(tag),String(detail??""));
 };

 window.ysftb0Status=function(status,message){
  const tag=
   status==="success"?"OK":
   status==="failure"?"FAIL":
   "INFO";

  add(tag,message);
 };

 window.addEventListener("error",event=>{
  add("JB-THREW",event.message||"Unknown JavaScript error");
 });

 window.addEventListener("unhandledrejection",event=>{
  add("JB-THREW",String(event.reason||"Promise rejected"));
 });

 add("INFO","Initializing terminal...");
 add("OK","Terminal ready");
 add("WAIT","Waiting for diagnostic events...");

 cursor=document.createElement("span");
 cursor.className="cursor";
 terminal.appendChild(cursor);

})();
</script>

</body>
</html>
